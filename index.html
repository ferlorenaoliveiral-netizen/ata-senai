<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ata de Conselho de Classe - SENAI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 720px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; text-align: center; font-size: 1.2rem; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; font-size: 0.85rem; margin-top: 0; }
        fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 15px; background: #fafafa; }
        legend { font-weight: bold; color: #0056b3; padding: 0 5px; font-size: 0.95rem; }
        label { font-weight: bold; display: block; margin-top: 8px; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.95rem; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        button { width: 100%; background-color: #0056b3; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 4px; margin-top: 10px; cursor: pointer; }
        button:hover { background-color: #003d80; }
        .btn-secundario { background-color: #0056b3; margin-top: 8px; font-size: 0.85rem; padding: 6px 12px; }
        .btn-secundario:hover { background-color: #003d80; }
        .btn-add-aluno { background-color: #28a745; margin-top: 8px; font-size: 0.9rem; padding: 10px; }
        .btn-add-aluno:hover { background-color: #218838; }
        .btn-remover { background-color: #dc3545; margin-top: 8px; font-size: 0.9rem; padding: 10px; }
        .btn-remover:hover { background-color: #c82333; }
        .aluno-card { border: 1px dashed #0056b3; padding: 12px; margin-bottom: 15px; border-radius: 6px; background-color: #fff; }
        .uc-box { border: 1px solid #e0e0e0; padding: 10px; margin-top: 10px; border-radius: 4px; background-color: #fcfcfc; }
    </style>
</head>
<body>

<div class="container">
    <h2>SENAI - Conselho de Classe</h2>
    <p class="sub">Gerador Oficial de Atas Deliberativas</p>
    
    <fieldset>
        <legend>1. Identificação da Unidade e Turma</legend>
        <label>Unidade SENAI:</label>
        <input type="text" id="unidade" value="SENAI Telêmaco Borba">

        <label>Tipo de Curso / Modalidade:</label>
        <select id="tipoCurso">
            <option value="Técnico">Técnico (Média Mínima: 7,0)</option>
            <option value="Qualificação">Qualificação (Média Mínima: 6,0)</option>
            <option value="Aperfeiçoamento">Aperfeiçoamento (Média Mínima: 6,0)</option>
        </select>

        <label>Nome do Curso:</label>
        <input type="text" id="curso" placeholder="Ex: Técnico em Celulose e Papel">

        <label>Nome / Identificação da Turma:</label>
        <input type="text" id="turma" placeholder="Ex: 1º Mód. Téc. em Celulose e Papel – COE">

        <div class="row">
            <div class="col">
                <label>Cód. Turma:</label>
                <input type="text" id="codTurma" placeholder="Ex: TEC-N-002106/2026">
            </div>
            <div class="col">
                <label>Turno:</label>
                <input type="text" id="turno" placeholder="Ex: Noturno">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Período das Aulas:</label>
                <input type="text" id="periodo" placeholder="Ex: 04/09/2026 a 25/09/2026">
            </div>
            <div class="col">
                <label>Período Letivo:</label>
                <input type="text" id="periodoLetivo" placeholder="Ex: 2026/DP">
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>2. Equipe Pedagógica e Secretaria</legend>
        <label>Data por Extenso / Local:</label>
        <input type="text" id="dataExtenso" placeholder="Ex: Aos vinte e nove dias do mês de setembro de 2026">

        <label>Orientador(a) Pedagógico(a):</label>
        <input type="text" id="pedagogo" value="Fernanda Lorena Oliveira">

        <label>Assistente Pedagógico(a):</label>
        <input type="text" id="assistente" value="Julia Thainá Gonçalves">

        <label>Supervisor(a) de Área:</label>
        <select id="supervisor">
            <option value="Karina Cristiane Kendrick">Karina Cristiane Kendrick</option>
            <option value="Jose Aparecido Sovinski De Andrade">Jose Aparecido Sovinski De Andrade</option>
            <option value="Gabriel Athayde Stockler">Gabriel Athayde Stockler</option>
            <option value="Arialba De Lourdes Xavier">Arialba De Lourdes Xavier</option>
        </select>

        <label>Representante da Secretaria:</label>
        <input type="text" id="secretaria" value="Reinaldo José de Almeida">
    </fieldset>

    <fieldset>
        <legend>3. Técnicos de Ensino (Preencha até 6)</legend>
        <label>Técnico(a) de Ensino 1:</label>
        <input type="text" id="tec1" placeholder="Ex: Edson Antonio Ribas Soares">

        <label>Técnico(a) de Ensino 2:</label>
        <input type="text" id="tec2" placeholder="Nome do Técnico 2 (opcional)">

        <label>Técnico(a) de Ensino 3:</label>
        <input type="text" id="tec3" placeholder="Nome do Técnico 3 (opcional)">

        <label>Técnico(a) de Ensino 4:</label>
        <input type="text" id="tec4" placeholder="Nome do Técnico 4 (opcional)">

        <label>Técnico(a) de Ensino 5:</label>
        <input type="text" id="tec5" placeholder="Nome do Técnico 5 (opcional)">

        <label>Técnico(a) de Ensino 6:</label>
        <input type="text" id="tec6" placeholder="Nome do Técnico 6 (opcional)">
    </fieldset>

    <fieldset>
        <legend>4. Dados do Aluno e Unidade Curricular</legend>
        
        <label style="margin-bottom: 12px; cursor: pointer;">
            <input type="checkbox" id="chkSemReprovados" onchange="toggleSemReprovados()" style="width: auto; display: inline-block;"> 
            <strong>Marque aqui se NÃO HOUVER alunos reprovados nesta ata</strong>
        </label>

        <div id="containerAlunos">
            <!-- Aluno #1 -->
            <div class="aluno-card" id="alunoCard_1">
                <strong style="color: #0056b3; font-size: 1rem;">Aluno #1</strong>
                <div class="row">
                    <div class="col" style="flex: 0.8;">
                        <label>R.A.:</label>
                        <input type="text" class="input-ra" placeholder="Ex: 01074504">
                    </div>
                    <div class="col" style="flex: 1.5;">
                        <label>Nome do Aluno:</label>
                        <input type="text" class="input-aluno" placeholder="Ex: Pedro Santana de Souza">
                    </div>
                </div>

                <!-- Container de UCs para o Aluno #1 -->
                <div class="ucs-container">
                    <div class="uc-box">
                        <strong style="color: #555; font-size: 0.85rem;">Unidade Curricular #1</strong>
                        <label>Nome da UC:</label>
                        <input type="text" class="input-uc" placeholder="Ex: Comunicação Oral e Escrita – 48h (EAD)">

                        <div class="row">
                            <div class="col">
                                <label>Nota Final:</label>
                                <input type="text" class="input-nota" placeholder="Ex: 5,0">
                            </div>
                            <div class="col">
                                <label>Faltas:</label>
                                <input type="text" class="input-faltas" placeholder="Ex: 0">
                            </div>
                            <div class="col">
                                <label>Frequência (%):</label>
                                <input type="text" class="input-freq" placeholder="Ex: 100%">
                            </div>
                        </div>

                        <label>Decisão do Conselho para esta UC:</label>
                        <select class="input-deliberacao">
                            <option value="APROVAÇÃO">APROVAÇÃO por Conselho de Classe</option>
                            <option value="RETENÇÃO">RETENÇÃO por Conselho de Classe</option>
                            <option value="REASSINATURA DE PLANO">Aguardando Plano de Recuperação</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="btn-secundario" onclick="adicionarUc(this)">+ Adicionar Outra UC para este Aluno</button>
            </div>
        </div>

        <div class="row" id="botoesAlunos">
            <div class="col">
                <button type="button" class="btn-add-aluno" onclick="adicionarAlunoCard()">+ Adicionar Outro Aluno</button>
            </div>
            <div class="col">
                <button type="button" class="btn-remover" onclick="removerUltimoAlunoCard()">- Remover Último Aluno</button>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>5. Encerramento</legend>
        <label>Data Final (Cidade e Data para Assinatura):</label>
        <input type="text" id="dataAssinatura" placeholder="Ex: Telêmaco Borba, 29 de setembro de 2026.">
    </fieldset>

    <button onclick="gerarAta()">Gerar Ata Timbrada</button>
</div>

<script>
let contadorAlunos = 1;

function adicionarAlunoCard() {
    contadorAlunos++;
    let container = document.getElementById('containerAlunos');
    let novoCard = document.createElement('div');
    novoCard.className = 'aluno-card';
    novoCard.id = `alunoCard_${contadorAlunos}`;
    novoCard.innerHTML = `
        <strong style="color: #0056b3; font-size: 1rem;">Aluno #${contadorAlunos}</strong>
        <div class="row">
            <div class="col" style="flex: 0.8;">
                <label>R.A.:</label>
                <input type="text" class="input-ra" placeholder="Ex: 01074504">
            </div>
            <div class="col" style="flex: 1.5;">
                <label>Nome do Aluno:</label>
                <input type="text" class="input-aluno" placeholder="Ex: Nome do Aluno ${contadorAlunos}">
            </div>
        </div>

        <div class="ucs-container">
            <div class="uc-box">
                <strong style="color: #555; font-size: 0.85rem;">Unidade Curricular #1</strong>
                <label>Nome da UC:</label>
                <input type="text" class="input-uc" placeholder="Ex: Unidade Curricular">

                <div class="row">
                    <div class="col">
                        <label>Nota Final:</label>
                        <input type="text" class="input-nota" placeholder="Ex: 5,0">
                    </div>
                    <div class="col">
                        <label>Faltas:</label>
                        <input type="text" class="input-faltas" placeholder="Ex: 0">
                    </div>
                    <div class="col">
                        <label>Frequência (%):</label>
                        <input type="text" class="input-freq" placeholder="Ex: 100%">
                    </div>
                </div>

                <label>Decisão do Conselho para esta UC:</label>
                <select class="input-deliberacao">
                    <option value="APROVAÇÃO">APROVAÇÃO por Conselho de Classe</option>
                    <option value="RETENÇÃO">RETENÇÃO por Conselho de Classe</option>
                    <option value="REASSINATURA DE PLANO">Aguardando Plano de Recuperação</option>
                </select>
            </div>
        </div>

        <button type="button" class="btn-secundario" onclick="adicionarUc(this)">+ Adicionar Outra UC para este Aluno</button>
    `;
    container.appendChild(novoCard);
}

function adicionarUc(btn) {
    let card = btn.closest('.aluno-card');
    let ucsContainer = card.querySelector('.ucs-container');
    let numUcs = ucsContainer.querySelectorAll('.uc-box').length + 1;

    let novaUc = document.createElement('div');
    novaUc.className = 'uc-box';
    novaUc.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="color: #555; font-size: 0.85rem;">Unidade Curricular #${numUcs}</strong>
            <span style="color:#dc3545; cursor:pointer; font-size:0.8rem; font-weight:bold;" onclick="this.closest('.uc-box').remove()">[Remover UC]</span>
        </div>
        <label>Nome da UC:</label>
        <input type="text" class="input-uc" placeholder="Ex: Outra Unidade Curricular">

        <div class="row">
            <div class="col">
                <label>Nota Final:</label>
                <input type="text" class="input-nota" placeholder="Ex: 5,0">
            </div>
            <div class="col">
                <label>Faltas:</label>
                <input type="text" class="input-faltas" placeholder="Ex: 0">
            </div>
            <div class="col">
                <label>Frequência (%):</label>
                <input type="text" class="input-freq" placeholder="Ex: 100%">
            </div>
        </div>

        <label>Decisão do Conselho para esta UC:</label>
        <select class="input-deliberacao">
            <option value="APROVAÇÃO">APROVAÇÃO por Conselho de Classe</option>
            <option value="RETENÇÃO">RETENÇÃO por Conselho de Classe</option>
            <option value="REASSINATURA DE PLANO">Aguardando Plano de Recuperação</option>
        </select>
    `;
    ucsContainer.appendChild(novaUc);
}

function removerUltimoAlunoCard() {
    if (contadorAlunos > 1) {
        let cardParaRemover = document.getElementById(`alunoCard_${contadorAlunos}`);
        if (cardParaRemover) {
            cardParaRemover.remove();
            contadorAlunos--;
        }
    }
}

function toggleSemReprovados() {
    let chk = document.getElementById('chkSemReprovados');
    let container = document.getElementById('containerAlunos');
    let botoes = document.getElementById('botoesAlunos');
    if (chk.checked) {
        container.style.display = 'none';
        botoes.style.display = 'none';
    } else {
        container.style.display = 'block';
        botoes.style.display = 'flex';
    }
}

function gerarAta() {
    let unidade = document.getElementById('unidade').value || 'SENAI Telêmaco Borba';
    let tipoCurso = document.getElementById('tipoCurso').value;
    let curso = document.getElementById('curso').value || '[Curso]';
    let turma = document.getElementById('turma').value || '[Turma]';
    let codTurma = document.getElementById('codTurma').value || '[Cód]';
    let turno = document.getElementById('turno').value || '[Turno]';
    let periodo = document.getElementById('periodo').value || '[Período]';
    let periodoLetivo = document.getElementById('periodoLetivo').value || '[Período Letivo]';
    let dataExtenso = document.getElementById('dataExtenso').value || 'Nesta data';
    let pedagogo = document.getElementById('pedagogo').value;
    let assistente = document.getElementById('assistente').value;
    let supervisor = document.getElementById('supervisor').value;
    let secretaria = document.getElementById('secretaria').value;
    let semReprovados = document.getElementById('chkSemReprovados').checked;
    let dataAssinatura = document.getElementById('dataAssinatura').value || 'Telêmaco Borba, 29 de setembro de 2026.';

    let textoMedia = (tipoCurso === "Qualificação" || tipoCurso === "Aperfeiçoamento") ? "6,0 (seis)" : "7,0 (sete)";

    // Coleta dos Técnicos
    let tecsLista = [
        document.getElementById('tec1').value.trim(),
        document.getElementById('tec2').value.trim(),
        document.getElementById('tec3').value.trim(),
        document.getElementById('tec4').value.trim(),
        document.getElementById('tec5').value.trim(),
        document.getElementById('tec6').value.trim()
    ].filter(n => n !== "");

    // Texto de Membros Presentes
    let membrosTexto = [];
    if(pedagogo) membrosTexto.push(`<strong>${pedagogo}</strong>, Orientador(a) Pedagógico(a)`);
    if(assistente) membrosTexto.push(`<strong>${assistente}</strong>, Assistente Pedagógico(a)`);
    if(supervisor) membrosTexto.push(`<strong>${supervisor}</strong>, Supervisor(a) de Área`);
    
    if(tecsLista.length > 0) {
        let rotulo = tecsLista.length > 1 ? "Técnicos de Ensino" : "Técnico de Ensino";
        membrosTexto.push(`<strong>${tecsLista.join('; ')}</strong>, ${rotulo}`);
    }
    if(secretaria) membrosTexto.push(`<strong>${secretaria}</strong>, representante da Secretaria`);

    let textoMembrosFormatado = membrosTexto.join('; ') + '.';

    // Assinaturas
    let assinaturasHtml = '';
    if(pedagogo) assinaturasHtml += `<div class="assinatura-box"><div class="linha"></div><strong>${pedagogo}</strong><br>Orientador(a) Pedagógico(a)</div>`;
    if(assistente) assinaturasHtml += `<div class="assinatura-box"><div class="linha"></div><strong>${assistente}</strong><br>Assistente Pedagógico(a)</div>`;
    if(supervisor) assinaturasHtml += `<div class="assinatura-box"><div class="linha"></div><strong>${supervisor}</strong><br>Supervisor(a) de Área</div>`;
    
    tecsLista.forEach(nomeTec => {
        assinaturasHtml += `<div class="assinatura-box"><div class="linha"></div><strong>${nomeTec}</strong><br>Técnico de Ensino</div>`;
    });

    if(secretaria) assinaturasHtml += `<div class="assinatura-box"><div class="linha"></div><strong>${secretaria}</strong><br>Secretaria</div>`;

    // Processamento de Alunos/UCs
    let blocoTabelaETexto = '';
    
    if (semReprovados) {
        blocoTabelaETexto = `
        <p class="texto-paragrafo">
            O Conselho de Classe analisou, com base na Ata de Resultado Final da turma e considerando os critérios regimentais da instituição — que estabelecem para cursos de nível <strong>${tipoCurso}</strong> a média <strong>${textoMedia}</strong> para aprovação direta e a frequência mínima de 75% (setenta e cinco por cento) em cada Unidade Curricular (UC) —, a situação acadêmica de todos os estudantes matriculados.
        </p>
        <p class="texto-paragrafo">
            Após a verificação dos rendimentos e percursos pedagógicos, o Conselho registrou que <strong>NÃO HÁ ALUNOS REPROVADOS</strong> na referida Unidade Curricular / período, constando a totalidade dos discentes em situação de regularidade e aprovação.
        </p>
        `;
    } else {
        let cards = document.querySelectorAll('.aluno-card');
        let linhasTabela = '';
        let decisoesTexto = [];

        cards.forEach((card) => {
            let ra = card.querySelector('.input-ra').value || 'N/A';
            let aluno = card.querySelector('.input-aluno').value || 'N/A';
            let ucBoxes = card.querySelectorAll('.uc-box');

            let numUcsAluno = ucBoxes.length;

            ucBoxes.forEach((ucBox, index) => {
                let uc = ucBox.querySelector('.input-uc').value || '[Unidade Curricular]';
                let nota = ucBox.querySelector('.input-nota').value || '-';
                let faltas = ucBox.querySelector('.input-faltas').value || '-';
                let freq = ucBox.querySelector('.input-freq').value || '-';
                let deliberacao = ucBox.querySelector('.input-deliberacao').value;

                if (index === 0) {
                    linhasTabela += `
                        <tr>
                            <td rowspan="${numUcsAluno}">${ra}</td>
                            <td rowspan="${numUcsAluno}">${aluno}</td>
                            <td>${uc}</td>
                            <td>${nota}</td>
                            <td>${faltas}</td>
                            <td>${freq}</td>
                        </tr>
                    `;
                } else {
                    linhasTabela += `
                        <tr>
                            <td>${uc}</td>
                            <td>${nota}</td>
                            <td>${faltas}</td>
                            <td>${freq}</td>
                        </tr>
                    `;
                }

                decisoesTexto.push(`pela <strong>${deliberacao}</strong> do aluno(a) <strong>${aluno}</strong> (R.A. <strong>${ra}</strong>) na Unidade Curricular <strong>${uc}</strong>`);
            });
        });

        blocoTabelaETexto = `
        <p class="texto-paragrafo">
            O Conselho de Classe analisou, com base na Ata de Resultado Final da turma e considerando os critérios regimentais da instituição — que estabelecem para cursos de nível <strong>${tipoCurso}</strong> a média <strong>${textoMedia}</strong> para aprovação direta e a frequência mínima de 75% (setenta e cinco por cento) em cada Unidade Curricular (UC) —, a situação do(s) aluno(s) abaixo relacionado(s):
        </p>

        <table class="dados-tabela">
            <thead>
                <tr>
                    <th>R.A.</th>
                    <th>Aluno</th>
                    <th>Unidade Curricular</th>
                    <th>Nota</th>
                    <th>Faltas</th>
                    <th>Frequência</th>
                </tr>
            </thead>
            <tbody>
                ${linhasTabela}
            </tbody>
        </table>

        <p class="texto-paragrafo">
            Após a análise do desempenho e do percurso no(s) componente(s) curricular(es), o Conselho deliberou, por unanimidade, ${decisoesTexto.join('; ')}.
        </p>
        `;
    }

    // SVG Logotipo
    let logoSenaiSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="220" height="55">
        <rect width="400" height="100" fill="#0056b3"/>
        <line x1="0" y1="20" x2="30" y2="20" stroke="#fff" stroke-width="4"/>
        <line x1="0" y1="40" x2="30" y2="40" stroke="#fff" stroke-width="4"/>
        <line x1="0" y1="60" x2="30" y2="60" stroke="#fff" stroke-width="4"/>
        <line x1="0" y1="80" x2="30" y2="80" stroke="#fff" stroke-width="4"/>
        <line x1="370" y1="20" x2="400" y2="20" stroke="#fff" stroke-width="4"/>
        <line x1="370" y1="40" x2="400" y2="40" stroke="#fff" stroke-width="4"/>
        <line x1="370" y1="60" x2="400" y2="60" stroke="#fff" stroke-width="4"/>
        <line x1="370" y1="80" x2="400" y2="80" stroke="#fff" stroke-width="4"/>
        <text x="200" y="68" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">SENAI</text>
    </svg>`;

    let htmlAta = `
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Ata de Conselho - ${curso}</title>
        <style>
            body { font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.4; padding: 30px; max-width: 800px; margin: auto; }
            .timbrado { text-align: center; margin-bottom: 15px; }
            .header { text-align: center; font-weight: bold; margin-bottom: 20px; }
            .header div { font-size: 11pt; }
            .header .title { font-size: 13pt; margin-top: 8px; text-decoration: underline; }
            .info-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
            .info-table td { padding: 4px 0; }
            .dados-tabela { width: 100%; border-collapse: collapse; margin: 15px 0; text-align: center; }
            .dados-tabela th, .dados-tabela td { border: 1px solid #000; padding: 6px; font-size: 10pt; }
            .dados-tabela th { background-color: #f2f2f2; }
            .texto-paragrafo { text-align: justify; margin-bottom: 15px; text-indent: 30px; }
            .assinaturas { margin-top: 35px; width: 100%; }
            .assinaturas-grid { display: flex; flex-wrap: wrap; justify-content: space-between; row-gap: 25px; }
            .assinatura-box { width: 45%; text-align: center; font-size: 9pt; }
            .linha { border-top: 1px solid #000; margin-bottom: 4px; }
            @media print {
                button { display: none; }
                body { padding: 0; }
            }
        </style>
    </head>
    <body>
        <button onclick="window.print()" style="margin-bottom:20px; padding:10px 20px; font-size:14px; cursor:pointer;">Imprimir / Salvar em PDF</button>

        <div class="timbrado">
            ${logoSenaiSvg}
        </div>
